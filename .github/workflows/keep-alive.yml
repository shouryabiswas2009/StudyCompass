name: Keep Supabase awake

# Supabase pauses free-tier projects after about a week without activity,
# which makes login fail until someone restores the project by hand. This
# runs a tiny read query every 3 days so the project always counts as active.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one row from the universities table
        env:
          # Set these under Settings → Secrets and variables → Actions.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/universities?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $status"
          # Fail loudly (GitHub emails you) if the project is down or the
          # secrets are missing, instead of silently doing nothing.
          test "$status" = "200"
